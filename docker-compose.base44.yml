# Base44 sandbox development environment for the NebuZX portfolio.
#
# This repo is a plain static site (index.html + style.css + script.js) with no
# build step and no package manager manifest of its own. The `web` service runs
# a Vite dev server straight from the bind-mounted source so edits show up in
# the preview immediately (Vite full-reloads the page on HTML changes and applies
# CSS/JS updates without a manual refresh).
#
# Preview entry point: host port 3000 -> Vite (container port 3000).

services:
  web:
    image: node:22
    restart: on-failure
    working_dir: /app
    command:
      - sh
      - -ec
      - |
        if [ ! -d node_modules/vite ]; then
          npm install --no-audit --no-fund
        fi
        exec ./node_modules/.bin/vite --host 0.0.0.0 --port 3000 --strictPort
    environment:
      # Vite >= 6.1 appends this to `server.allowedHosts`, which is what lets the
      # proxy host (<port>-<sandbox id>.$BASE44_SANDBOX_HOST_DOMAIN) reach the dev
      # server. Set by the platform; passed through bare so we never hardcode it.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PREVIEW_MODE
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      # node_modules lives in a named volume: it is installed on container start
      # (bind mounts are only available then) and survives restarts, so a repo
      # bind mount never hides the installed dependencies.
      - node_modules:/app/node_modules
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  node_modules:
